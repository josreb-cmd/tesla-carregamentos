<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla Carregamentos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f3;
    --surface: #ffffff;
    --surface2: #f0f0ee;
    --border: #e0e0dc;
    --border2: #d0d0cc;
    --text: #1a1a1a;
    --text2: #666666;
    --text3: #999999;
    --red: #c0392b;
    --green: #1a7a4a;
    --blue: #1a6abf;
    --amber: #c0720a;
    --jose: #1a6abf;
    --jose-bg: rgba(26,106,191,0.08);
    --alex: #1a7a4a;
    --alex-bg: rgba(26,122,74,0.08);
    --accent: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.5; min-height: 100vh; }
 
  .header { border-bottom: 1px solid var(--border); padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { width: 32px; height: 32px; }
  .header h1 { font-size: 16px; font-weight: 500; letter-spacing: 0.02em; }
  .header-sub { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .sheet-link { font-size: 12px; color: var(--blue); text-decoration: none; font-family: 'DM Mono', monospace; opacity: 0.8; }
  .sheet-link:hover { opacity: 1; }
  .sync-status { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; display: flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .dot.loading { background: var(--amber); animation: pulse 1s infinite; }
  .dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
 
  .main { max-width: 900px; margin: 0 auto; padding: 2rem; }
 
  .section { margin-bottom: 2rem; }
  .section-label { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; font-family: 'DM Mono', monospace; margin-bottom: 1rem; }
 
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 2rem; }
  .metric { background: var(--surface); padding: 1.25rem 1.5rem; }
  .metric-label { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .metric-value { font-size: 26px; font-weight: 300; letter-spacing: -0.02em; font-family: 'DM Mono', monospace; }
  .metric-value.green { color: var(--green); }
  .metric-value.red { color: var(--red); }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
 
  .user-section { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 2rem; }
  .user-card { background: var(--surface); padding: 1.25rem 1.5rem; }
  .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .user-name { font-size: 13px; font-weight: 500; }
  .user-name.jose { color: var(--jose); }
  .user-name.alex { color: var(--alex); }
  .user-net { font-size: 20px; font-weight: 300; font-family: 'DM Mono', monospace; }
  .user-details { display: flex; gap: 16px; font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; margin-bottom: 10px; }
  .user-details span.disc { color: var(--green); }
  .bar-track { background: var(--surface2); border-radius: 2px; height: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
  .bar-jose { background: var(--jose); }
  .bar-alex { background: var(--alex); }
 
  .filter-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; }
  .filter-row label { font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; }
  .filter-row input[type="date"] { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 13px; font-family: 'DM Mono', monospace; height: 34px; }
  .filter-row input[type="date"]:focus { outline: none; border-color: var(--blue); }
  .filter-row .sep { color: var(--text3); }
 
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr 120px 120px; gap: 10px; align-items: end; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; }
  .form-group input, .form-group select { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 6px; padding: 0 12px; font-size: 14px; height: 38px; font-family: 'DM Sans', sans-serif; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--blue); }
  .form-group select option { background: var(--surface2); }
  .form-bottom { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .form-group.wide { grid-column: span 2; }
 
  .btn { height: 38px; padding: 0 18px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border2); background: transparent; color: var(--text2); font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .btn:hover { border-color: var(--text2); color: var(--text); }
  .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-color: var(--border); color: var(--text3); }
  .btn-sm:hover { border-color: var(--red); color: var(--red); background: rgba(230,57,70,0.08); }
 
  table { width: 100%; border-collapse: collapse; }
  thead th { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; padding: 0 12px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  thead th:last-child { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  td { padding: 12px; font-size: 13px; vertical-align: middle; }
  td.mono { font-family: 'DM Mono', monospace; }
  td.right { text-align: right; }
  td.muted { color: var(--text2); }
 
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .badge-jose { background: var(--jose-bg); color: var(--jose); }
  .badge-alex { background: var(--alex-bg); color: var(--alex); }
  .disc-tag { font-size: 11px; color: var(--green); font-family: 'DM Mono', monospace; }
 
  .empty { text-align: center; padding: 3rem; color: var(--text3); font-size: 14px; }
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
 
  .api-config { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; }
  .api-config p { font-size: 13px; color: var(--text2); margin-bottom: 12px; line-height: 1.6; }
  .api-config code { font-family: 'DM Mono', monospace; background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-size: 12px; color: var(--amber); }
  .api-input-row { display: flex; gap: 10px; }
  .api-input-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 6px; padding: 0 12px; font-size: 13px; height: 38px; font-family: 'DM Mono', monospace; }
  .api-input-row input:focus { outline: none; border-color: var(--blue); }
 
  @media (max-width: 640px) {
    .main { padding: 0.75rem; }
    .header { padding: 0.75rem 1rem; flex-wrap: wrap; gap: 8px; }
    .sheet-link { display: none; }
    .metrics { grid-template-columns: 1fr; }
    .metric-value { font-size: 20px; }
    .user-section { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-group.wide { grid-column: span 2; }
    .filter-row { gap: 6px; padding: 0.75rem; }
    .filter-row input[type="date"] { flex: 1; min-width: 0; font-size: 12px; padding: 6px; }
    .col-local, .col-desconto { display: none; }
    table { font-size: 12px; }
    td { padding: 8px 6px; }
    thead th { padding: 0 6px 8px; font-size: 10px; }
    .btn { height: 44px; font-size: 14px; }
    .btn-sm { height: 32px; padding: 0 8px; }
    .form-group input, .form-group select { height: 44px; font-size: 16px; }
    .api-input-row { flex-direction: column; }
    .api-input-row input { height: 44px; font-size: 16px; }
  }
  @media (min-width: 641px) and (max-width: 900px) {
    .main { padding: 1.5rem; }
    .form-grid { grid-template-columns: 1fr 1fr 100px 100px; }
  }
</style>
</head>
<body>
 
<div class="header">
  <div class="header-left">
    <svg class="logo" viewBox="0 0 32 32" fill="none">
      <rect width="32" height="32" rx="6" fill="#e63946"/>
      <path d="M16 6L8 11v4h2v7h4v-5h4v5h4V15h2v-4L16 6z" fill="white"/>
      <path d="M10 11.5L16 8l6 3.5" stroke="white" stroke-width="0.5" fill="none" opacity="0.4"/>
    </svg>
    <div>
      <div class="header h1" style="font-size:15px;font-weight:500;letter-spacing:0.02em">Tesla Carregamentos</div>
      <div class="header-sub">Gestão de custos</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1u_dVIV9fp4MqC1BPYrL8b7VlgFSdluHhEL3O_zKfT8w" target="_blank">↗ Google Sheet</a>
    <div class="sync-status"><div class="dot" id="dot"></div><span id="statusText">A carregar...</span></div>
  </div>
</div>
 
<div class="main">
 
  <!-- Password config -->
  <div class="api-config" id="apiConfig">
    <div class="section-label">Acesso</div>
    <p>Insere a <code>password</code> para aceder à app.</p>
    <div class="api-input-row">
      <input type="password" id="passwordInput" placeholder="password..." onkeydown="if(event.key==='Enter') unlockApp()" />
      <button class="btn btn-primary" onclick="unlockApp()">Entrar</button>
    </div>
    <div id="pwError" style="font-size:12px;color:var(--red);margin-top:8px;display:none">Password incorreta. Tenta novamente.</div>
  </div>
 
  <!-- Filtro período -->
  <div class="filter-row">
    <label>Período</label>
    <input type="date" id="dateFrom" onchange="render()" />
    <span class="sep">→</span>
    <input type="date" id="dateTo" onchange="render()" />
    <button class="btn" onclick="clearFilter()">Limpar filtro</button>
    <button class="btn" onclick="loadTransactions()" style="margin-left:auto">↻ Sincronizar</button>
  </div>
 
  <!-- Métricas -->
  <div id="summarySection" style="display:none">
    <div class="metrics" id="metricsEl"></div>
    <div class="user-section" id="userSection"></div>
  </div>
 
  <!-- Formulário -->
  <div class="form-card">
    <div class="section-label">Nova transação</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Data</label>
        <input type="date" id="txDate" />
      </div>
      <div class="form-group">
        <label>Utilizador</label>
        <select id="txUser">
          <option value="José">José</option>
          <option value="Alex">Alex</option>
        </select>
      </div>
      <div class="form-group">
        <label>Valor (€)</label>
        <input type="number" id="txAmount" placeholder="0.00" min="0" step="0.01" />
      </div>
      <div class="form-group">
        <label>Desconto (€)</label>
        <input type="number" id="txDiscount" placeholder="0.00" min="0" step="0.01" />
      </div>
      <div class="form-group wide">
        <label>Local</label>
        <input type="text" id="txLocation" placeholder="ex: Supercharger Lisboa" />
      </div>
    </div>
    <div class="form-bottom">
      <button class="btn btn-primary" id="addBtn" onclick="addTx()">Adicionar transação</button>
    </div>
  </div>
 
  <!-- Tabela -->
  <div class="table-card">
    <div style="padding:1rem 1.25rem 0.5rem;border-bottom:1px solid var(--border)">
      <div class="section-label" style="margin-bottom:0">Transações</div>
    </div>
    <div id="txTable"></div>
  </div>
 
</div>
 
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwh_qogxQIsuqlgmZg36VucHZX22ci8YIf-y4-Tuuxmw9u4q9v77vKgqiELg_acpYPG/exec';
let transactions = [];
let PASSWORD = '';
 
function setStatus(msg, state='ok') {
  document.getElementById('statusText').textContent = msg;
  const dot = document.getElementById('dot');
  dot.className = 'dot' + (state==='loading'?' loading':state==='error'?' error':'');
}
 
async function unlockApp() {
  const password = document.getElementById('passwordInput').value.trim();
  if (!password) return;
  setStatus('A verificar...', 'loading');
  document.getElementById('pwError').style.display = 'none';
  try {
    const res = await fetch(`${SCRIPT_URL}?password=${encodeURIComponent(password)}&action=read`);
    const data = await res.json();
    if (data.error) {
      document.getElementById('pwError').style.display = 'block';
      setStatus('Password incorreta', 'error');
      return;
    }
    PASSWORD = password;
    transactions = Array.isArray(data) ? data : [];
    transactions.forEach(t => {
      t.date = normalizeDate(t.date);
      t.amount = parseFloat(t.amount)||0;
      t.discount = parseFloat(t.discount)||0;
    });
    transactions.sort((a,b) => b.date.localeCompare(a.date));
    document.getElementById('apiConfig').style.display = 'none';
    setStatus('Sincronizado ✓', 'ok');
    render();
  } catch(e) {
    setStatus('Erro de ligação', 'error');
  }
}
 
async function callScript(action, data) {
  let url = `${SCRIPT_URL}?password=${encodeURIComponent(PASSWORD)}&action=${action}`;
  if (data) url += `&data=${encodeURIComponent(JSON.stringify(data))}`;
  const res = await fetch(url);
  return await res.json();
}
 
async function loadTransactions() {
  if (!PASSWORD) return;
  setStatus('A sincronizar...', 'loading');
  try {
    const data = await callScript('read');
    transactions = Array.isArray(data) ? data : [];
    transactions.forEach(t => {
      t.date = normalizeDate(t.date);
      t.amount = parseFloat(t.amount)||0;
      t.discount = parseFloat(t.discount)||0;
    });
    transactions.sort((a, b) => b.date.localeCompare(a.date));
    setStatus('Sincronizado ✓', 'ok');
  } catch(e) {
    setStatus('Erro de sincronização', 'error');
    transactions = [];
  }
  render();
}
 
async function addTx() {
  const dateRaw = document.getElementById('txDate').value; // YYYY-MM-DD from input
  const [dy, dm, dd] = dateRaw.split('-');
  const date = `${dd}-${dm}-${dy}`; // DD-MM-YYYY for sheet
  const user = document.getElementById('txUser').value;
  const amount = parseFloat(document.getElementById('txAmount').value) || 0;
  const discount = parseFloat(document.getElementById('txDiscount').value) || 0;
  const location = document.getElementById('txLocation').value.trim();
  if (!date || amount <= 0) { alert('Preenche a data e o valor.'); return; }
  const btn = document.getElementById('addBtn');
  btn.disabled = true; btn.textContent = 'A guardar...';
  setStatus('A guardar...', 'loading');
  try {
    await callScript('append', { date, user, amount, discount, location });
    document.getElementById('txAmount').value = '';
    document.getElementById('txDiscount').value = '';
    document.getElementById('txLocation').value = '';
    await loadTransactions();
  } catch(e) {
    setStatus('Erro ao guardar', 'error');
  }
  btn.disabled = false; btn.textContent = 'Adicionar transação';
}
 
async function deleteTx(id) {
  if (!confirm('Eliminar esta transação?')) return;
  const tx = transactions.find(t => t.id === id);
  if (!tx) return;
  setStatus('A eliminar...', 'loading');
  try {
    await callScript('delete', { date: tx.date, user: tx.user, amount: tx.amount });
    await loadTransactions();
  } catch(e) {
    setStatus('Erro ao eliminar', 'error');
  }
}
 
function clearFilter() {
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  render();
}
 
function getFiltered() {
  const from = document.getElementById('dateFrom').value || null;
  const to = document.getElementById('dateTo').value || null;
  return transactions.filter(t => {
    if (from && t.date < from) return false;
    if (to && t.date > to) return false;
    return true;
  });
}
 
function fmt(v) { return v.toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
 
// Normalize any date format to YYYY-MM-DD for sorting/filtering
function normalizeDate(d) {
  if (!d) return '';
  d = String(d).trim();
  // DD/MM/YYYY or DD-MM-YYYY
  if (/^\d{2}[\/-]\d{2}[\/-]\d{4}$/.test(d)) {
    const [day, month, year] = d.split(/[\/-]/);
    return `${year}-${month}-${day}`;
  }
  // YYYY-MM-DD already
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  // Try parsing as Date object (e.g. from Sheets serial)
  const parsed = new Date(d);
  if (!isNaN(parsed)) {
    return parsed.toISOString().split('T')[0];
  }
  return d;
}
 
// Display date as DD-MM-YYYY
function fmtDate(d) {
  const iso = normalizeDate(d);
  if (!iso) return '—';
  const [y, m, day] = iso.split('-');
  return `${day}-${m}-${y}`;
}
 
function render() {
  const filtered = getFiltered();
  const users = ['José', 'Alex'];
  const totals = {}, discounts = {}, nets = {};
  users.forEach(u => { totals[u] = 0; discounts[u] = 0; nets[u] = 0; });
  let grandTotal = 0, grandDiscount = 0;
  filtered.forEach(t => {
    totals[t.user] = (totals[t.user] || 0) + t.amount;
    discounts[t.user] = (discounts[t.user] || 0) + t.discount;
    nets[t.user] = (nets[t.user] || 0) + (t.amount - t.discount);
    grandTotal += t.amount;
    grandDiscount += t.discount;
  });
  const grandNet = grandTotal - grandDiscount;
 
  const ss = document.getElementById('summarySection');
  if (filtered.length > 0) {
    ss.style.display = '';
    document.getElementById('metricsEl').innerHTML = `
      <div class="metric"><div class="metric-label">Custo bruto total</div><div class="metric-value">${fmt(grandTotal)}</div><div class="metric-sub">${filtered.length} transação${filtered.length !== 1 ? 'ões' : ''}</div></div>
      <div class="metric"><div class="metric-label">Total descontos</div><div class="metric-value green">-${fmt(grandDiscount)}</div><div class="metric-sub">poupança total</div></div>
      <div class="metric"><div class="metric-label">Custo líquido</div><div class="metric-value">${fmt(grandNet)}</div><div class="metric-sub">após descontos</div></div>
    `;
    const maxNet = Math.max(...users.map(u => nets[u]), 0.01);
    document.getElementById('userSection').innerHTML = users.map(u => `
      <div class="user-card">
        <div class="user-header">
          <span class="user-name ${u === 'José' ? 'jose' : 'alex'}">${u}</span>
          <span class="user-net">${fmt(nets[u])}</span>
        </div>
        <div class="user-details">
          <span>Bruto: ${fmt(totals[u])}</span>
          <span class="disc">Desconto: -${fmt(discounts[u])}</span>
        </div>
        <div class="bar-track"><div class="bar-fill bar-${u === 'José' ? 'jose' : 'alex'}" style="width:${nets[u] ? Math.round(nets[u] / maxNet * 100) : 0}%"></div></div>
      </div>
    `).join('');
  } else {
    ss.style.display = 'none';
  }
 
  const tt = document.getElementById('txTable');
  if (filtered.length === 0) {
    tt.innerHTML = '<div class="empty">Nenhuma transação no período selecionado.</div>';
    return;
  }
  tt.innerHTML = `<table>
    <thead><tr>
      <th>Data</th><th class="col-local">Local</th><th>Utilizador</th>
      <th style="text-align:right">Valor</th>
      <th class="col-desconto" style="text-align:right">Desconto</th>
      <th style="text-align:right">Líquido</th>
      <th style="text-align:right"></th>
    </tr></thead>
    <tbody>${filtered.map(t => `<tr>
      <td class="mono muted" style="white-space:nowrap">${fmtDate(t.date)}</td>
      <td class="muted col-local">${t.location || '—'}</td>
      <td><span class="badge badge-${t.user === 'José' ? 'jose' : 'alex'}">${t.user}</span></td>
      <td class="mono right">${fmt(t.amount)}</td>
      <td class="right col-desconto">${t.discount > 0 ? `<span class="disc-tag">-${fmt(t.discount)}</span>` : '<span class="muted">—</span>'}</td>
      <td class="mono right" style="font-weight:500">${fmt(t.amount - t.discount)}</td>
      <td class="right"><button class="btn btn-sm" onclick="deleteTx(${t.id})">✕</button></td>
    </tr>`).join('')}</tbody>
  </table>`;
}
 
// Init
document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
setStatus('Aguarda login', 'error');
render();
</script>
</body>
</html>
